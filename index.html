<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>일정관리</title>
<style>
  :root {
    --bg: #f5f6f8;
    --card: #ffffff;
    --text: #1f2430;
    --muted: #7a8194;
    --line: #e4e7ee;
    --accent: #3b6ef5;
    --danger: #e5484d;
    --radius: 12px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
    line-height: 1.5;
  }
  header {
    background: var(--card);
    border-bottom: 1px solid var(--line);
    padding: 0 24px;
    display: flex;
    align-items: center;
    gap: 24px;
    height: 56px;
    position: sticky;
    top: 0;
    z-index: 50;
  }
  header h1 { font-size: 17px; font-weight: 700; }
  nav { display: flex; gap: 4px; flex: 1; }
  nav button {
    border: none; background: none; cursor: pointer;
    font-size: 14px; font-weight: 500; color: var(--muted);
    padding: 8px 14px; border-radius: 8px; height: 56px;
    border-bottom: 2px solid transparent; border-radius: 0;
  }
  nav button.active { color: var(--accent); border-bottom-color: var(--accent); font-weight: 700; }
  nav button:hover { color: var(--text); }
  .header-actions { display: flex; gap: 8px; }

  main { max-width: 1100px; margin: 0 auto; padding: 24px; }
  .tab-page { display: none; }
  .tab-page.active { display: block; }

  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 20px;
    margin-bottom: 20px;
  }
  .card-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
  .card-head h2 { font-size: 16px; font-weight: 700; }
  .card-head .sub { font-size: 12px; color: var(--muted); margin-top: 2px; }

  button.btn {
    border: 1px solid var(--line); background: var(--card); color: var(--text);
    padding: 6px 12px; border-radius: 8px; font-size: 13px; cursor: pointer;
    font-family: inherit;
  }
  button.btn:hover { background: #f0f2f6; }
  button.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  button.btn.primary:hover { background: #2f5cd8; }
  button.btn.danger { color: var(--danger); border-color: #f3c1c3; }
  button.btn.danger:hover { background: #fdf0f0; }
  button.btn.small { padding: 3px 8px; font-size: 12px; }

  /* ---------- 프로젝트 파이프라인 ---------- */
  .project-row {
    display: flex; align-items: flex-start; gap: 16px;
    padding: 14px 0; border-bottom: 1px solid var(--line);
  }
  .project-row:last-child { border-bottom: none; }
  .project-row.done { opacity: 0.55; }
  .project-info { width: 190px; flex-shrink: 0; }
  .project-name { font-weight: 700; font-size: 14px; display: flex; align-items: center; gap: 7px; }
  .color-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .project-meta { font-size: 11px; color: var(--muted); margin: 2px 0 8px 17px; }
  .project-actions { display: flex; gap: 4px; flex-wrap: wrap; margin-left: 17px; }
  .pipeline {
    flex: 1; display: flex; align-items: center; flex-wrap: wrap;
    gap: 4px; row-gap: 14px; padding-top: 4px; min-width: 0;
  }
  .stage {
    padding: 7px 14px; border-radius: 9px; cursor: pointer;
    min-width: 92px; text-align: center; position: relative;
    border: 1.5px solid transparent; transition: transform .1s;
  }
  .stage:hover { transform: translateY(-1px); }
  .stage .stage-name { font-weight: 600; font-size: 13px; }
  .stage .stage-date { font-size: 10.5px; opacity: .75; margin-top: 1px; }
  .stage.completed { color: #fff; }
  .stage.current { background: #fff; animation: pulse 2s infinite; }
  .stage-connector { color: #b6bcc9; font-size: 15px; padding: 0 4px; user-select: none; }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(59,110,245,0); }
    50% { box-shadow: 0 0 0 4px rgba(59,110,245,.12); }
  }
  .empty-hint { color: var(--muted); font-size: 13px; text-align: center; padding: 28px 0; }

  /* ---------- 하루 업무 기록 ---------- */
  .log-toolbar { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
  .log-toolbar input[type="date"] {
    border: 1px solid var(--line); border-radius: 8px; padding: 5px 10px;
    font-family: inherit; font-size: 13px; background: var(--card); color: var(--text);
  }
  .paste-area { margin-bottom: 16px; }
  .paste-area textarea {
    width: 100%; min-height: 84px; border: 1px dashed #c3c9d6; border-radius: 10px;
    padding: 12px; font-family: inherit; font-size: 13px; resize: vertical;
    background: #fafbfd; color: var(--text);
  }
  .paste-area textarea:focus { outline: none; border-color: var(--accent); background: #fff; }
  .paste-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 8px; }

  table.log-table { width: 100%; border-collapse: collapse; }
  table.log-table th {
    text-align: left; font-size: 12px; color: var(--muted); font-weight: 600;
    padding: 8px 10px; border-bottom: 2px solid var(--line); white-space: nowrap;
  }
  table.log-table td { padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
  table.log-table tr:hover td { background: #fafbfd; }
  .log-text-input, .people-input {
    width: 100%; border: 1px solid transparent; border-radius: 6px; padding: 4px 6px;
    font-family: inherit; font-size: 13px; background: transparent; color: var(--text);
  }
  .log-text-input:hover, .people-input:hover { border-color: var(--line); }
  .log-text-input:focus, .people-input:focus { outline: none; border-color: var(--accent); background: #fff; }
  select.project-select {
    border: 1px solid var(--line); border-radius: 6px; padding: 4px 6px;
    font-family: inherit; font-size: 12.5px; background: var(--card); color: var(--text);
    max-width: 150px;
  }
  .proj-tag {
    display: inline-flex; align-items: center; gap: 5px;
    font-size: 12px; font-weight: 600; padding: 2px 9px; border-radius: 20px;
  }
  .person-tag {
    display: inline-block; background: #eef1f6; border-radius: 20px;
    padding: 1px 8px; font-size: 11.5px; margin: 1px 2px 1px 0; color: #444c5e;
  }
  .attach-list { display: flex; flex-direction: column; gap: 3px; }
  .attach-chip {
    display: inline-flex; align-items: center; gap: 6px; font-size: 12px;
    background: #eef1f6; border-radius: 6px; padding: 2px 8px; max-width: 180px;
  }
  .attach-chip a { color: var(--accent); text-decoration: none; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: pointer; }
  .attach-chip a:hover { text-decoration: underline; }
  .attach-chip .rm { cursor: pointer; color: var(--muted); font-weight: 700; }
  .attach-chip .rm:hover { color: var(--danger); }
  .icon-btn { border: none; background: none; cursor: pointer; font-size: 14px; padding: 2px 5px; border-radius: 6px; }
  .icon-btn:hover { background: #eef1f6; }

  /* ---------- 캘린더 ---------- */
  .cal-toolbar { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
  .cal-toolbar h2 { font-size: 18px; font-weight: 700; min-width: 130px; text-align: center; }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); border-left: 1px solid var(--line); border-top: 1px solid var(--line); }
  .cal-dow {
    padding: 7px 0; text-align: center; font-size: 12px; font-weight: 600; color: var(--muted);
    border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); background: #fafbfd;
  }
  .cal-dow.sun { color: var(--danger); }
  .cal-dow.sat { color: var(--accent); }
  .cal-cell {
    min-height: 96px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line);
    padding: 5px 6px; cursor: pointer; position: relative;
  }
  .cal-cell:hover { background: #f6f8fc; }
  .cal-cell.other-month { background: #fafafa; color: #c0c4ce; }
  .cal-cell .day-num { font-size: 12px; font-weight: 600; }
  .cal-cell.today .day-num {
    background: var(--accent); color: #fff; border-radius: 50%;
    display: inline-flex; width: 20px; height: 20px; align-items: center; justify-content: center;
  }
  .cal-cell .day-num.sun { color: var(--danger); }
  .cal-cell.today .day-num.sun { color: #fff; }
  .cal-event {
    font-size: 11px; border-radius: 5px; padding: 1px 6px; margin-top: 3px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600;
  }
  .cal-event.type-데드라인 { background: #fdeaea; color: #c62f34; border-left: 3px solid #e5484d; }
  .cal-event.type-중요일정 { background: #fef2e2; color: #b25e09; border-left: 3px solid #f0932b; }
  .cal-event.type-일반 { background: #e8eefe; color: #2b55c4; border-left: 3px solid #3b6ef5; }
  .log-badge {
    position: absolute; top: 5px; right: 6px; font-size: 10px; background: #e4e7ee;
    color: #59607a; border-radius: 10px; padding: 0 6px; font-weight: 700;
  }
  .log-badge:hover { background: var(--accent); color: #fff; }

  /* ---------- 모달 ---------- */
  .modal-backdrop {
    position: fixed; inset: 0; background: rgba(20,25,40,.4);
    display: flex; align-items: center; justify-content: center; z-index: 100;
  }
  .modal {
    background: var(--card); border-radius: 14px; padding: 22px; width: 380px; max-width: 92vw;
    box-shadow: 0 12px 40px rgba(0,0,0,.18);
  }
  .modal h3 { font-size: 15px; font-weight: 700; margin-bottom: 16px; }
  .modal .field { margin-bottom: 12px; }
  .modal label { display: block; font-size: 12px; font-weight: 600; color: var(--muted); margin-bottom: 4px; }
  .modal input[type="text"], .modal input[type="date"], .modal select {
    width: 100%; border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px;
    font-family: inherit; font-size: 13.5px; background: var(--card); color: var(--text);
  }
  .modal input:focus, .modal select:focus { outline: none; border-color: var(--accent); }
  .modal .modal-actions { display: flex; justify-content: space-between; align-items: center; margin-top: 18px; }
  .modal .modal-actions .right { display: flex; gap: 8px; margin-left: auto; }
  .color-picker { display: flex; gap: 6px; flex-wrap: wrap; }
  .color-picker .swatch {
    width: 22px; height: 22px; border-radius: 50%; cursor: pointer; border: 2px solid transparent;
  }
  .color-picker .swatch.selected { border-color: var(--text); }
  .event-list-in-modal { margin-bottom: 12px; display: flex; flex-direction: column; gap: 6px; }
  .event-list-in-modal .ev-row {
    display: flex; align-items: center; gap: 8px; font-size: 13px;
    background: #fafbfd; border: 1px solid var(--line); border-radius: 8px; padding: 5px 10px;
  }
  .event-list-in-modal .ev-row .del { margin-left: auto; cursor: pointer; color: var(--muted); font-weight: 700; }
  .event-list-in-modal .ev-row .del:hover { color: var(--danger); }
  .type-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .type-dot.type-데드라인 { background: #e5484d; }
  .type-dot.type-중요일정 { background: #f0932b; }
  .type-dot.type-일반 { background: #3b6ef5; }

  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    background: #262c3d; color: #fff; padding: 9px 18px; border-radius: 10px;
    font-size: 13px; z-index: 200; opacity: 0; transition: opacity .25s; pointer-events: none;
  }
  .toast.show { opacity: 1; }
</style>
</head>
<body>

<header>
  <h1>📋 일정관리</h1>
  <nav>
    <button id="tab-btn-dashboard" class="active" onclick="switchTab('dashboard')">대시보드</button>
    <button id="tab-btn-calendar" onclick="switchTab('calendar')">캘린더</button>
  </nav>
  <div class="header-actions">
    <button class="btn small" onclick="exportData()">내보내기</button>
    <button class="btn small" onclick="document.getElementById('import-input').click()">가져오기</button>
    <input type="file" id="import-input" accept=".json" style="display:none" onchange="importData(this)">
  </div>
</header>

<main>
  <!-- ============ 대시보드 탭 ============ -->
  <div id="page-dashboard" class="tab-page active">
    <div class="card">
      <div class="card-head">
        <div>
          <h2>프로젝트 진행 현황</h2>
          <div class="sub">단계가 끝나면 「다음 단계」로 새 바를 이어 붙이세요.</div>
        </div>
        <button class="btn primary" onclick="openProjectModal()">＋ 새 프로젝트</button>
      </div>
      <div id="project-list"></div>
    </div>

    <div class="card">
      <div class="card-head">
        <div>
          <h2>하루 업무 기록</h2>
          <div class="sub">아웃룩 요약을 붙여넣고 「분류하기」를 누르면 표로 정리됩니다.</div>
        </div>
        <div class="log-toolbar" style="margin-bottom:0">
          <input type="date" id="log-date" onchange="onLogDateChange(this.value)">
          <button class="btn small" onclick="goToday()">오늘</button>
        </div>
      </div>

      <div class="paste-area">
        <textarea id="paste-box" placeholder="아웃룩 하루 요약을 여기에 붙여넣으세요. (한 줄 = 업무 하나)&#10;예)&#10;촉매 합성 결과 김선임과 논의&#10;A프로젝트 중간보고서 초안 작성"></textarea>
        <div class="paste-actions">
          <button class="btn" onclick="addEmptyLog()">＋ 행 직접 추가</button>
          <button class="btn primary" onclick="classifyPaste()">분류하기</button>
        </div>
      </div>

      <table class="log-table">
        <thead>
          <tr>
            <th style="width:42%">업무 내용</th>
            <th style="width:16%">관련 프로젝트</th>
            <th style="width:18%">관련 인물</th>
            <th style="width:18%">첨부 파일</th>
            <th style="width:6%"></th>
          </tr>
        </thead>
        <tbody id="log-tbody"></tbody>
      </table>
      <div id="log-empty" class="empty-hint" style="display:none">이 날짜에 기록된 업무가 없습니다.</div>
    </div>
  </div>

  <!-- ============ 캘린더 탭 ============ -->
  <div id="page-calendar" class="tab-page">
    <div class="card">
      <div class="cal-toolbar">
        <button class="btn" onclick="moveMonth(-1)">◀</button>
        <h2 id="cal-title"></h2>
        <button class="btn" onclick="moveMonth(1)">▶</button>
        <button class="btn small" onclick="calToday()">오늘</button>
        <div style="margin-left:auto; font-size:12px; color:var(--muted)">
          <span style="color:#e5484d">●</span> 데드라인&nbsp;&nbsp;
          <span style="color:#f0932b">●</span> 중요일정&nbsp;&nbsp;
          <span style="color:#3b6ef5">●</span> 일반&nbsp;&nbsp;
          날짜를 클릭해 일정을 추가하세요.
        </div>
      </div>
      <div class="cal-grid" id="cal-grid"></div>
    </div>
  </div>
</main>

<div class="toast" id="toast"></div>

<script>
"use strict";
/* ================= 데이터 저장 ================= */
const LS_KEY = "scheduleApp.v1";
const PALETTE = ["#3b6ef5","#0fa87a","#f0932b","#a55eea","#e5484d","#0aa2c0","#d6338f","#6b7280"];
let store = { projects: [], logs: [], events: [] };
let selectedDate = todayStr();
let calCursor = { y: new Date().getFullYear(), m: new Date().getMonth() };

function todayStr(d) {
  const dt = d || new Date();
  return dt.getFullYear() + "-" + String(dt.getMonth()+1).padStart(2,"0") + "-" + String(dt.getDate()).padStart(2,"0");
}
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
}
function load() {
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (raw) store = Object.assign({ projects: [], logs: [], events: [] }, JSON.parse(raw));
  } catch (e) { console.error("데이터 로드 실패", e); }
}
function save() { localStorage.setItem(LS_KEY, JSON.stringify(store)); }
function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove("show"), 2200);
}

/* ================= IndexedDB (첨부 파일) ================= */
let dbPromise = null;
function openDB() {
  if (dbPromise) return dbPromise;
  dbPromise = new Promise((resolve, reject) => {
    const req = indexedDB.open("scheduleAppFiles", 1);
    req.onupgradeneeded = () => req.result.createObjectStore("files", { keyPath: "id" });
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
  return dbPromise;
}
async function idbPutFile(record) {
  const db = await openDB();
  return new Promise((res, rej) => {
    const tx = db.transaction("files", "readwrite");
    tx.objectStore("files").put(record);
    tx.oncomplete = res;
    tx.onerror = () => rej(tx.error);
  });
}
async function idbGetFile(id) {
  const db = await openDB();
  return new Promise((res, rej) => {
    const req = db.transaction("files").objectStore("files").get(id);
    req.onsuccess = () => res(req.result);
    req.onerror = () => rej(req.error);
  });
}
async function idbDeleteFile(id) {
  const db = await openDB();
  return new Promise((res, rej) => {
    const tx = db.transaction("files", "readwrite");
    tx.objectStore("files").delete(id);
    tx.oncomplete = res;
    tx.onerror = () => rej(tx.error);
  });
}
async function idbAllFiles() {
  const db = await openDB();
  return new Promise((res, rej) => {
    const req = db.transaction("files").objectStore("files").getAll();
    req.onsuccess = () => res(req.result || []);
    req.onerror = () => rej(req.error);
  });
}
async function idbClear() {
  const db = await openDB();
  return new Promise((res, rej) => {
    const tx = db.transaction("files", "readwrite");
    tx.objectStore("files").clear();
    tx.oncomplete = res;
    tx.onerror = () => rej(tx.error);
  });
}

/* ================= 탭 ================= */
function switchTab(name) {
  document.querySelectorAll(".tab-page").forEach(p => p.classList.remove("active"));
  document.querySelectorAll("nav button").forEach(b => b.classList.remove("active"));
  document.getElementById("page-" + name).classList.add("active");
  document.getElementById("tab-btn-" + name).classList.add("active");
  if (name === "calendar") renderCalendar();
}

/* ================= 모달 공통 ================= */
function showModal(innerHTML) {
  closeModal();
  const bd = document.createElement("div");
  bd.className = "modal-backdrop";
  bd.id = "modal-backdrop";
  bd.innerHTML = '<div class="modal">' + innerHTML + '</div>';
  bd.addEventListener("mousedown", e => { if (e.target === bd) closeModal(); });
  document.body.appendChild(bd);
  const first = bd.querySelector("input, select");
  if (first) first.focus();
  return bd;
}
function closeModal() {
  const el = document.getElementById("modal-backdrop");
  if (el) el.remove();
}

/* ================= 프로젝트 / 파이프라인 ================= */
function getProject(id) { return store.projects.find(p => p.id === id); }

function openProjectModal(projectId) {
  const p = projectId ? getProject(projectId) : null;
  const usedColor = p ? p.color : PALETTE[store.projects.length % PALETTE.length];
  const bd = showModal(`
    <h3>${p ? "프로젝트 수정" : "새 프로젝트"}</h3>
    <div class="field">
      <label>프로젝트 이름</label>
      <input type="text" id="m-proj-name" value="${esc(p ? p.name : "")}" placeholder="예: 신규 촉매 개발">
    </div>
    ${p ? "" : `
    <div class="field">
      <label>첫 단계 이름</label>
      <input type="text" id="m-stage-name" value="" placeholder="예: 기획 (비우면 '시작')">
    </div>`}
    <div class="field">
      <label>색상</label>
      <div class="color-picker" id="m-color-picker">
        ${PALETTE.map(c => `<div class="swatch ${c === usedColor ? "selected" : ""}" data-color="${c}" style="background:${c}"></div>`).join("")}
      </div>
    </div>
    <div class="modal-actions">
      ${p ? '<button class="btn danger" id="m-proj-delete">프로젝트 삭제</button>' : ""}
      <div class="right">
        <button class="btn" onclick="closeModal()">취소</button>
        <button class="btn primary" id="m-proj-save">${p ? "저장" : "만들기"}</button>
      </div>
    </div>
  `);
  let color = usedColor;
  bd.querySelectorAll(".swatch").forEach(sw => sw.addEventListener("click", () => {
    bd.querySelectorAll(".swatch").forEach(s => s.classList.remove("selected"));
    sw.classList.add("selected");
    color = sw.dataset.color;
  }));
  bd.querySelector("#m-proj-save").addEventListener("click", () => {
    const name = bd.querySelector("#m-proj-name").value.trim();
    if (!name) { toast("프로젝트 이름을 입력하세요."); return; }
    if (p) {
      p.name = name; p.color = color;
    } else {
      const stageName = (bd.querySelector("#m-stage-name").value.trim()) || "시작";
      store.projects.push({
        id: uid(), name, color, status: "active", createdAt: todayStr(),
        stages: [{ id: uid(), name: stageName, startDate: todayStr(), status: "진행중" }]
      });
    }
    save(); renderProjects(); renderLogs(); closeModal();
  });
  const delBtn = bd.querySelector("#m-proj-delete");
  if (delBtn) delBtn.addEventListener("click", () => {
    if (!confirm(`'${p.name}' 프로젝트를 삭제할까요?\n업무 기록의 프로젝트 연결도 해제됩니다.`)) return;
    store.projects = store.projects.filter(x => x.id !== p.id);
    store.logs.forEach(l => { if (l.projectId === p.id) l.projectId = null; });
    store.events.forEach(ev => { if (ev.projectId === p.id) ev.projectId = null; });
    save(); renderProjects(); renderLogs(); closeModal();
  });
}

function nextStage(projectId) {
  const p = getProject(projectId);
  if (!p) return;
  const bd = showModal(`
    <h3>다음 단계로 진행</h3>
    <div class="field">
      <label>새 단계 이름</label>
      <input type="text" id="m-next-name" placeholder="예: 실험, 분석, 보고서 작성 …">
    </div>
    <div class="modal-actions"><div class="right">
      <button class="btn" onclick="closeModal()">취소</button>
      <button class="btn primary" id="m-next-save">진행</button>
    </div></div>
  `);
  const doIt = () => {
    const name = bd.querySelector("#m-next-name").value.trim();
    if (!name) { toast("단계 이름을 입력하세요."); return; }
    const last = p.stages[p.stages.length - 1];
    if (last) last.status = "완료";
    p.stages.push({ id: uid(), name, startDate: todayStr(), status: "진행중" });
    p.status = "active";
    save(); renderProjects(); closeModal();
  };
  bd.querySelector("#m-next-save").addEventListener("click", doIt);
  bd.querySelector("#m-next-name").addEventListener("keydown", e => { if (e.key === "Enter") doIt(); });
}

function toggleProjectDone(projectId) {
  const p = getProject(projectId);
  if (!p) return;
  if (p.status === "done") {
    p.status = "active";
    const last = p.stages[p.stages.length - 1];
    if (last) last.status = "진행중";
  } else {
    p.status = "done";
    p.stages.forEach(s => s.status = "완료");
  }
  save(); renderProjects();
}

function editStage(projectId, stageId) {
  const p = getProject(projectId);
  const s = p && p.stages.find(x => x.id === stageId);
  if (!s) return;
  const bd = showModal(`
    <h3>단계 수정</h3>
    <div class="field"><label>단계 이름</label><input type="text" id="m-st-name" value="${esc(s.name)}"></div>
    <div class="field"><label>시작일</label><input type="date" id="m-st-date" value="${esc(s.startDate)}"></div>
    <div class="modal-actions">
      <button class="btn danger" id="m-st-delete">단계 삭제</button>
      <div class="right">
        <button class="btn" onclick="closeModal()">취소</button>
        <button class="btn primary" id="m-st-save">저장</button>
      </div>
    </div>
  `);
  bd.querySelector("#m-st-save").addEventListener("click", () => {
    const name = bd.querySelector("#m-st-name").value.trim();
    if (!name) { toast("단계 이름을 입력하세요."); return; }
    s.name = name;
    s.startDate = bd.querySelector("#m-st-date").value || s.startDate;
    save(); renderProjects(); closeModal();
  });
  bd.querySelector("#m-st-delete").addEventListener("click", () => {
    if (p.stages.length <= 1) { toast("마지막 단계는 삭제할 수 없습니다."); return; }
    p.stages = p.stages.filter(x => x.id !== stageId);
    const last = p.stages[p.stages.length - 1];
    if (p.status !== "done" && last) last.status = "진행중";
    save(); renderProjects(); closeModal();
  });
}

function renderProjects() {
  const wrap = document.getElementById("project-list");
  if (!store.projects.length) {
    wrap.innerHTML = '<div class="empty-hint">아직 프로젝트가 없습니다. 「＋ 새 프로젝트」로 첫 바를 만들어 보세요.</div>';
    return;
  }
  const active = store.projects.filter(p => p.status !== "done");
  const done = store.projects.filter(p => p.status === "done");
  wrap.innerHTML = [...active, ...done].map(p => {
    const bars = p.stages.map((s, i) => {
      const isCurrent = s.status === "진행중";
      const style = isCurrent
        ? `border-color:${p.color}; color:${p.color};`
        : `background:${p.color};`;
      return `${i > 0 ? '<span class="stage-connector">▶</span>' : ""}
        <div class="stage ${isCurrent ? "current" : "completed"}" style="${style}"
             title="클릭하여 수정" onclick="editStage('${p.id}','${s.id}')">
          <div class="stage-name">${esc(s.name)}${isCurrent ? " ⏳" : ""}</div>
          <div class="stage-date">${esc(s.startDate)}</div>
        </div>`;
    }).join("");
    return `
      <div class="project-row ${p.status === "done" ? "done" : ""}">
        <div class="project-info">
          <div class="project-name"><span class="color-dot" style="background:${p.color}"></span>${esc(p.name)}</div>
          <div class="project-meta">${esc(p.createdAt)} 시작 · ${p.stages.length}단계${p.status === "done" ? " · 완료됨" : ""}</div>
          <div class="project-actions">
            ${p.status === "done" ? "" : `<button class="btn small primary" onclick="nextStage('${p.id}')">다음 단계 ▶</button>`}
            <button class="btn small" onclick="toggleProjectDone('${p.id}')">${p.status === "done" ? "재개" : "완료"}</button>
            <button class="btn small" onclick="openProjectModal('${p.id}')">수정</button>
          </div>
        </div>
        <div class="pipeline">${bars}</div>
      </div>`;
  }).join("");
}

/* ================= 하루 업무 기록 ================= */
function logsOfDay(date) { return store.logs.filter(l => l.date === date); }

function onLogDateChange(v) { if (v) { selectedDate = v; renderLogs(); } }
function goToday() {
  selectedDate = todayStr();
  document.getElementById("log-date").value = selectedDate;
  renderLogs();
}

function suggestProject(text) {
  const t = text.toLowerCase();
  let best = null;
  for (const p of store.projects) {
    const name = p.name.toLowerCase();
    if (t.includes(name)) { best = p; break; }
    // 프로젝트 이름의 단어 단위 부분 일치 (2글자 이상)
    for (const w of name.split(/\s+/)) {
      if (w.length >= 2 && t.includes(w)) { best = best || p; }
    }
  }
  return best ? best.id : null;
}

function classifyPaste() {
  const box = document.getElementById("paste-box");
  const lines = box.value.split(/\n/).map(s => s.replace(/^[\s•·\-–▪–*]+/, "").trim()).filter(Boolean);
  if (!lines.length) { toast("붙여넣은 내용이 없습니다."); return; }
  let matched = 0;
  for (const line of lines) {
    const pid = suggestProject(line);
    if (pid) matched++;
    store.logs.push({ id: uid(), date: selectedDate, text: line, projectId: pid, people: [], attachmentIds: [] });
  }
  box.value = "";
  save(); renderLogs();
  toast(`${lines.length}건 추가됨 (프로젝트 자동 분류 ${matched}건)`);
}

function addEmptyLog() {
  store.logs.push({ id: uid(), date: selectedDate, text: "", projectId: null, people: [], attachmentIds: [] });
  save(); renderLogs();
  const rows = document.querySelectorAll("#log-tbody .log-text-input");
  if (rows.length) rows[rows.length - 1].focus();
}

function updateLog(id, field, value) {
  const l = store.logs.find(x => x.id === id);
  if (!l) return;
  if (field === "people") {
    l.people = value.split(",").map(s => s.trim()).filter(Boolean);
  } else if (field === "projectId") {
    l.projectId = value || null;
  } else {
    l[field] = value;
  }
  save(); renderLogs();
}

async function deleteLog(id) {
  const l = store.logs.find(x => x.id === id);
  if (!l) return;
  if (l.text && !confirm("이 업무 기록을 삭제할까요?")) return;
  for (const aid of (l.attachmentIds || [])) { try { await idbDeleteFile(aid); } catch (e) {} }
  store.logs = store.logs.filter(x => x.id !== id);
  save(); renderLogs();
}

function pickAttachment(logId) {
  const input = document.createElement("input");
  input.type = "file";
  input.multiple = true;
  input.addEventListener("change", async () => {
    const l = store.logs.find(x => x.id === logId);
    if (!l) return;
    for (const f of input.files) {
      const id = uid();
      try {
        await idbPutFile({ id, name: f.name, type: f.type, size: f.size, blob: f });
        l.attachmentIds = l.attachmentIds || [];
        l.attachmentIds.push(id);
        l._attachNames = l._attachNames || {};
        l._attachNames[id] = f.name;
      } catch (e) { toast("파일 저장 실패: " + f.name); }
    }
    save(); renderLogs();
  });
  input.click();
}

async function downloadAttachment(fileId) {
  const rec = await idbGetFile(fileId);
  if (!rec) { toast("파일을 찾을 수 없습니다."); return; }
  const url = URL.createObjectURL(rec.blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = rec.name;
  a.click();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
}

async function removeAttachment(logId, fileId) {
  const l = store.logs.find(x => x.id === logId);
  if (!l) return;
  l.attachmentIds = (l.attachmentIds || []).filter(x => x !== fileId);
  if (l._attachNames) delete l._attachNames[fileId];
  try { await idbDeleteFile(fileId); } catch (e) {}
  save(); renderLogs();
}

function renderLogs() {
  document.getElementById("log-date").value = selectedDate;
  const tbody = document.getElementById("log-tbody");
  const logs = logsOfDay(selectedDate);
  document.getElementById("log-empty").style.display = logs.length ? "none" : "block";
  const projOptions = pid => `<option value="">— 없음 —</option>` +
    store.projects.map(p => `<option value="${p.id}" ${p.id === pid ? "selected" : ""}>${esc(p.name)}</option>`).join("");
  tbody.innerHTML = logs.map(l => {
    const p = l.projectId ? getProject(l.projectId) : null;
    const tag = p ? `<span class="proj-tag" style="background:${p.color}1c; color:${p.color}"><span class="color-dot" style="background:${p.color}"></span>${esc(p.name)}</span><br>` : "";
    const attachChips = (l.attachmentIds || []).map(aid => {
      const nm = (l._attachNames && l._attachNames[aid]) || "파일";
      return `<span class="attach-chip"><a onclick="downloadAttachment('${aid}')" title="다운로드">📄 ${esc(nm)}</a><span class="rm" title="첨부 삭제" onclick="removeAttachment('${l.id}','${aid}')">×</span></span>`;
    }).join("");
    return `<tr>
      <td><input class="log-text-input" value="${esc(l.text)}" placeholder="업무 내용 입력"
                 onchange="updateLog('${l.id}','text',this.value)"></td>
      <td>${tag}<select class="project-select" onchange="updateLog('${l.id}','projectId',this.value)">${projOptions(l.projectId)}</select></td>
      <td>
        ${(l.people || []).map(nm => `<span class="person-tag">${esc(nm)}</span>`).join("")}
        <input class="people-input" value="${esc((l.people || []).join(", "))}" placeholder="이름, 이름"
               onchange="updateLog('${l.id}','people',this.value)">
      </td>
      <td>
        <div class="attach-list">${attachChips}</div>
        <button class="icon-btn" title="파일 첨부" onclick="pickAttachment('${l.id}')">📎</button>
      </td>
      <td><button class="icon-btn" title="삭제" onclick="deleteLog('${l.id}')">🗑️</button></td>
    </tr>`;
  }).join("");
}

/* ================= 캘린더 ================= */
function moveMonth(delta) {
  calCursor.m += delta;
  if (calCursor.m < 0) { calCursor.m = 11; calCursor.y--; }
  if (calCursor.m > 11) { calCursor.m = 0; calCursor.y++; }
  renderCalendar();
}
function calToday() {
  const n = new Date();
  calCursor = { y: n.getFullYear(), m: n.getMonth() };
  renderCalendar();
}

function eventsOfDay(date) { return store.events.filter(e => e.date === date); }

function openDayModal(date) {
  const evs = eventsOfDay(date);
  const bd = showModal(`
    <h3>${date} 일정</h3>
    <div class="event-list-in-modal" id="m-ev-list">
      ${evs.length ? evs.map(ev => {
        const p = ev.projectId ? getProject(ev.projectId) : null;
        return `<div class="ev-row">
          <span class="type-dot type-${ev.type}"></span>
          <span>${esc(ev.title)}</span>
          ${p ? `<span class="proj-tag" style="background:${p.color}1c; color:${p.color}; font-size:11px">${esc(p.name)}</span>` : ""}
          <span class="del" title="삭제" onclick="deleteEvent('${ev.id}','${date}')">×</span>
        </div>`;
      }).join("") : '<div style="font-size:12.5px; color:var(--muted)">등록된 일정이 없습니다.</div>'}
    </div>
    <div class="field"><label>새 일정 제목</label><input type="text" id="m-ev-title" placeholder="예: A프로젝트 보고서 마감"></div>
    <div class="field"><label>유형</label>
      <select id="m-ev-type">
        <option value="데드라인">데드라인</option>
        <option value="중요일정">중요일정</option>
        <option value="일반" selected>일반</option>
      </select>
    </div>
    <div class="field"><label>관련 프로젝트 (선택)</label>
      <select id="m-ev-proj">
        <option value="">— 없음 —</option>
        ${store.projects.map(p => `<option value="${p.id}">${esc(p.name)}</option>`).join("")}
      </select>
    </div>
    <div class="modal-actions"><div class="right">
      <button class="btn" onclick="closeModal()">닫기</button>
      <button class="btn primary" id="m-ev-save">추가</button>
    </div></div>
  `);
  const doAdd = () => {
    const title = bd.querySelector("#m-ev-title").value.trim();
    if (!title) { toast("일정 제목을 입력하세요."); return; }
    store.events.push({
      id: uid(), date, title,
      type: bd.querySelector("#m-ev-type").value,
      projectId: bd.querySelector("#m-ev-proj").value || null
    });
    save(); renderCalendar(); openDayModal(date);
  };
  bd.querySelector("#m-ev-save").addEventListener("click", doAdd);
  bd.querySelector("#m-ev-title").addEventListener("keydown", e => { if (e.key === "Enter") doAdd(); });
}

function deleteEvent(id, date) {
  store.events = store.events.filter(e => e.id !== id);
  save(); renderCalendar(); openDayModal(date);
}

function jumpToLogs(date) {
  selectedDate = date;
  switchTab("dashboard");
  renderLogs();
  document.getElementById("log-date").scrollIntoView({ behavior: "smooth", block: "center" });
}

function renderCalendar() {
  const { y, m } = calCursor;
  document.getElementById("cal-title").textContent = `${y}년 ${m + 1}월`;
  const grid = document.getElementById("cal-grid");
  const dows = ["일", "월", "화", "수", "목", "금", "토"];
  let html = dows.map((d, i) => `<div class="cal-dow ${i === 0 ? "sun" : ""} ${i === 6 ? "sat" : ""}">${d}</div>`).join("");
  const first = new Date(y, m, 1);
  const startOffset = first.getDay();
  const gridStart = new Date(y, m, 1 - startOffset);
  const today = todayStr();
  for (let i = 0; i < 42; i++) {
    const d = new Date(gridStart.getFullYear(), gridStart.getMonth(), gridStart.getDate() + i);
    const ds = todayStr(d);
    const inMonth = d.getMonth() === m;
    const evs = eventsOfDay(ds);
    const logCount = logsOfDay(ds).length;
    const evHtml = evs.slice(0, 3).map(ev => {
      const p = ev.projectId ? getProject(ev.projectId) : null;
      return `<div class="cal-event type-${ev.type}" title="${esc(ev.title)}">${p ? "["+esc(p.name)+"] " : ""}${esc(ev.title)}</div>`;
    }).join("") + (evs.length > 3 ? `<div style="font-size:10px;color:var(--muted)">+${evs.length - 3}건 더</div>` : "");
    html += `<div class="cal-cell ${inMonth ? "" : "other-month"} ${ds === today ? "today" : ""}" onclick="openDayModal('${ds}')">
      <span class="day-num ${d.getDay() === 0 ? "sun" : ""}">${d.getDate()}</span>
      ${logCount ? `<span class="log-badge" title="업무 기록 ${logCount}건 보기" onclick="event.stopPropagation(); jumpToLogs('${ds}')">📝${logCount}</span>` : ""}
      ${evHtml}
    </div>`;
  }
  grid.innerHTML = html;
}

/* ================= 백업 (내보내기 / 가져오기) ================= */
function blobToBase64(blob) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(r.result.split(",")[1]);
    r.onerror = rej;
    r.readAsDataURL(blob);
  });
}
async function exportData() {
  const files = await idbAllFiles();
  const totalSize = files.reduce((s, f) => s + (f.size || 0), 0);
  if (totalSize > 30 * 1024 * 1024 &&
      !confirm(`첨부 파일이 총 ${(totalSize/1024/1024).toFixed(1)}MB 입니다. 백업 파일이 커질 수 있습니다. 계속할까요?`)) return;
  const fileDump = [];
  for (const f of files) {
    fileDump.push({ id: f.id, name: f.name, type: f.type, size: f.size, data: await blobToBase64(f.blob) });
  }
  const payload = { app: "scheduleApp", version: 1, exportedAt: new Date().toISOString(),
                    projects: store.projects, logs: store.logs, events: store.events, files: fileDump };
  const blob = new Blob([JSON.stringify(payload)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `일정관리_백업_${todayStr()}.json`;
  a.click();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
  toast("백업 파일을 내려받았습니다.");
}
async function importData(input) {
  const file = input.files[0];
  input.value = "";
  if (!file) return;
  if (!confirm("가져오기를 하면 현재 데이터가 백업 파일의 내용으로 교체됩니다. 계속할까요?")) return;
  try {
    const payload = JSON.parse(await file.text());
    if (payload.app !== "scheduleApp") throw new Error("형식이 다른 파일입니다.");
    store = { projects: payload.projects || [], logs: payload.logs || [], events: payload.events || [] };
    await idbClear();
    for (const f of (payload.files || [])) {
      const bin = atob(f.data);
      const bytes = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      await idbPutFile({ id: f.id, name: f.name, type: f.type, size: f.size, blob: new Blob([bytes], { type: f.type }) });
    }
    save(); renderProjects(); renderLogs(); renderCalendar();
    toast("백업을 가져왔습니다.");
  } catch (e) {
    toast("가져오기 실패: " + e.message);
  }
}

/* ================= 시작 ================= */
load();
document.getElementById("log-date").value = selectedDate;
renderProjects();
renderLogs();
renderCalendar();
</script>
